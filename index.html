    // ==================== SPEECH HELPER ====================
    function speakMandarin(text, rate = 0.85) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "zh-CN";
      utter.rate = rate;
      const voices = window.speechSynthesis.getVoices();
      const zhVoice = voices.find(v => v.lang.includes("zh-CN") || v.lang.includes("zh"));
      if (zhVoice) utter.voice = zhVoice;
      window.speechSynthesis.speak(utter);
    }

    // ==================== LESSON QUESTION BUILDER ====================
    function buildLessonDeck(wordIds, includeIntros = true) {
      const targetWords = wordIds.map(id => ALL_WORDS.find(w => w.id === id)).filter(Boolean);
      const deck = [];

      if (includeIntros) {
        targetWords.slice(0, 3).forEach(w => {
          deck.push({ kind: "intro", word: w });
        });
      }

      targetWords.forEach((w, idx) => {
        const distractors = ALL_WORDS.filter(x => x.id !== w.id)
          .sort(() => Math.random() - 0.5)
          .slice(0, 3);
        const options = [w, ...distractors].sort(() => Math.random() - 0.5);

        if (idx % 3 === 0) {
          deck.push({
            kind: "listen_choose",
            word: w,
            options
          });
        } else if (idx % 3 === 1 && w.tokens && w.tokens.length >= 2) {
          const extraTokens = ["的", "很", "不", "吗"].filter(t => !w.tokens.includes(t)).slice(0, 2);
          deck.push({
            kind: "tile_build",
            word: w,
            bank: [...w.tokens, ...extraTokens].sort(() => Math.random() - 0.5)
          });
        } else {
          deck.push({
            kind: "meaning_choose",
            word: w,
            options
          });
        }
      });

      // Add a matching pairs round
      const pairWords = targetWords.slice(0, 4);
      if (pairWords.length >= 3) {
        deck.push({
          kind: "pairs",
          words: pairWords
        });
      }

      return deck;
    }

    // ==================== MAIN APP COMPONENT ====================
    function App() {
      const STORAGE_KEY = "mandarin90_v3_progress";

      const [progress, setProgress] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return {
          xp: 0,
          streak: 1,
          lastActiveDate: new Date().toDateString(),
          taskScores: {}, // { s1t1: 100 }
          wordStats: {}   // { w1: { correct: 2, wrong: 0 } }
        };
      });

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
        } catch (e) {}
      }, [progress]);

      const [activeTab, setActiveTab] = useState("path"); // path | practice | speak | plan
      const [activeLesson, setActiveLesson] = useState(null); // { title, badge, taskId?, deck }
      const [showBackupModal, setShowBackupModal] = useState(false);
      const [importText, setImportText] = useState("");
      const [copyNotice, setCopyNotice] = useState("");

      // Preload voices on iOS Safari
      useEffect(() => {
        if ("speechSynthesis" in window) {
          window.speechSynthesis.getVoices();
        }
      }, []);

      // Stage unlock check: Stage 1 always unlocked; Stage N unlocks when all 5 tasks of Stage N-1 >= 80%
      const isStageUnlocked = (stageIndex) => {
        if (stageIndex === 0) return true;
        const prevStage = STAGES[stageIndex - 1];
        return prevStage.tasks.every(t => (progress.taskScores[t.id] || 0) >= 80);
      };

      const startTaskLesson = (stage, task) => {
        const deck = buildLessonDeck(task.wordIds, true);
        setActiveLesson({
          title: task.title,
          badge: `${stage.badge} • ${task.type}`,
          taskId: task.id,
          deck
        });
      };

      const startPracticeMode = (mode) => {
        let chosenWords = [];
        if (mode === "weak") {
          const scored = ALL_WORDS.map(w => {
            const st = progress.wordStats[w.id] || { correct: 0, wrong: 0 };
            const ratio = st.correct - st.wrong * 2;
            return { w, ratio };
          }).sort((a, b) => a.ratio - b.ratio);
          chosenWords = scored.slice(0, 6).map(x => x.w.id);
        } else if (mode === "compliments") {
          chosenWords = STAGES[6].words.map(w => w.id);
        } else if (mode === "items") {
          chosenWords = STAGES[7].words.slice(0, 6).map(w => w.id);
        } else {
          chosenWords = [...ALL_WORDS].sort(() => Math.random() - 0.5).slice(0, 6).map(w => w.id);
        }

        const titles = {
          weak: "Weak Words Blitz",
          random: "Memory Refresh Quiz",
          compliments: "Social & Compliments Drill",
          items: "Daily Items & Animals Drill"
        };

        setActiveLesson({
          title: titles[mode] || "Unlimited Practice",
          badge: "∞ UNLIMITED PRACTICE",
          taskId: null,
          deck: buildLessonDeck(chosenWords, false)
        });
      };

      const handleLessonComplete = (accuracy, sessionWordResults) => {
        setProgress(prev => {
          const today = new Date().toDateString();
          const newTaskScores = { ...prev.taskScores };
          if (activeLesson?.taskId) {
            const oldBest = newTaskScores[activeLesson.taskId] || 0;
            newTaskScores[activeLesson.taskId] = Math.max(oldBest, accuracy);
          }
          const newWordStats = { ...prev.wordStats };
          Object.entries(sessionWordResults).forEach(([wid, res]) => {
            const cur = newWordStats[wid] || { correct: 0, wrong: 0 };
            newWordStats[wid] = {
              correct: cur.correct + res.correct,
              wrong: cur.wrong + res.wrong
            };
          });
          return {
            ...prev,
            xp: prev.xp + Math.max(15, Math.round(accuracy * 0.4)),
            streak: prev.lastActiveDate === today ? prev.streak : prev.streak + 1,
            lastActiveDate: today,
            taskScores: newTaskScores,
            wordStats: newWordStats
          };
        });
        setActiveLesson(null);
      };

      const masteredTasksCount = Object.values(progress.taskScores).filter(s => s >= 80).length;
      const totalTasksCount = STAGES.reduce((acc, s) => acc + s.tasks.length, 0);

      const copySaveCode = () => {
        const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(progress))));
        navigator.clipboard?.writeText(encoded);
        setCopyNotice("Copied! Paste this code into Apple Notes to keep a backup.");
        setTimeout(() => setCopyNotice(""), 4000);
      };

      const restoreSaveCode = () => {
        try {
          const decoded = JSON.parse(decodeURIComponent(escape(atob(importText.trim()))));
          if (decoded && typeof decoded.xp === "number") {
            setProgress(decoded);
            setImportText("");
            setCopyNotice("Progress restored successfully!");
            setTimeout(() => setCopyNotice(""), 3000);
          } else {
            setCopyNotice("Invalid save code format.");
          }
        } catch (e) {
          setCopyNotice("Could not read save code. Check that you copied the full text.");
        }
      };

        <div className="min-h-[100dvh] w-full bg-slate-950 flex justify-center items-center sm:py-4">
          {/* iPhone Container Frame */}
          <div className="w-full sm:w-[393px] h-[100dvh] sm:h-[852px] bg-[#F7F9FA] sm:rounded-[44px] sm:border-[8px] sm:border-slate-800 shadow-2xl flex flex-col overflow-hidden relative">
            
            {/* Top Status & Stats Bar */}

                  <span className="text-base">🔥</span>
                  <span className="font-extrabold text-orange-600 text-sm">{progress.streak}</span>
                </div>
                <div className="flex items-center gap-1 bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-xl">
                  <span className="text-base">⚡</span>
                  <span className="font-extrabold text-amber-600 text-sm">{progress.xp} XP</span>
                </div>
                <div className="flex items-center gap-1 bg-sky-50 border border-sky-200 px-2.5 py-1 rounded-xl">
                  <span className="font-black text-sky-600 text-sm">∞</span>
                </div>
              </div>

              <button
                onClick={() => setShowBackupModal(true)}
                className="flex items-center gap-1.5 bg-slate-100 active:translate-y-0.5 border-b-2 border-slate-300 px-2.5 py-1.5 rounded-xl text-xs font-extrabold text-slate-700"
              >
                <Icon name="Smartphone" size={14} />
                <span>Save & iPhone</span>
              </button>
            </header>

            {/* Main Viewport */}
            <main className="flex-1 overflow-y-auto no-scrollbar pb-24">
              {activeTab === "path" && (
                <PathView
                  stages={STAGES}
                  taskScores={progress.taskScores}
                  isStageUnlocked={isStageUnlocked}
                  onStartTask={startTaskLesson}
                  masteredTasksCount={masteredTasksCount}
                  totalTasksCount={totalTasksCount}
                />
              )}
              {activeTab === "practice" && (
                <PracticeView

                />

              {activeTab === "speak" && (
                <SpeakView />
              )}

                <PlanView
                  masteredTasksCount={masteredTasksCount}
                  totalTasksCount={totalTasksCount}
                />
              )}
            </main>

            {/* Bottom Navigation Bar */}
            <nav className="bg-white border-t-2 border-slate-200 px-2 pt-2 pb-3 safe-bottom flex justify-around items-center shrink-0 z-10">
              {[
                { id: "path", label: "Path", icon: "Map" },
                { id: "practice", label: "Practice", icon: "Dumbbell" },
                { id: "speak", label: "Speak", icon: "MessageCircle" },
                { id: "plan", label: "90-Day", icon: "Calendar" }
              ].map(tab => {
                const active = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex flex-col items-center justify-center w-16 py-1.5 rounded-2xl transition-all ${
                      active
                        ? "bg-[#DDF4FF] text-[#1CB0F6] border-2 border-[#84D8FF]"

                    }`}
                  >
                    <Icon name={tab.icon} size={20} />
                    <span className="text-[11px] font-extrabold mt-0.5">{tab.label}</span>
                  </button>
                );
              })}
            </nav>

            {/* Fullscreen Lesson Modal */}
            {activeLesson && (
              <LessonRunner
                lesson={activeLesson}
                onClose={() => setActiveLesson(null)}
                onComplete={handleLessonComplete}
              />
            )}

            {/* iPhone Setup & Backup Modal */}
            {showBackupModal && (
              <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-3">
                <div className="bg-white w-full rounded-3xl p-5 border-2 border-slate-200 shadow-2xl animate-pop max-h-[90%] overflow-y-auto">
                  <div className="flex items-center justify-between mb-3">
                    <h2 className="text-lg font-black text-slate-800">📱 iPhone App & Save Backup</h2>
                    <button
                      onClick={() => setShowBackupModal(false)}
                      className="p-1.5 rounded-xl bg-slate-100 text-slate-600 font-bold"
                    >
                      <Icon name="X" size={18} />
                    </button>
                  </div>

                  <div className="bg-sky-50 border-2 border-sky-200 rounded-2xl p-3.5 mb-4 text-xs text-slate-700 space-y-1.5">
                    <p className="font-black text-sky-800 text-sm">Install on Your iPhone Home Screen:</p>
                    <p>1. Open your GitHub Pages link in <strong>Safari</strong> (not Private mode).</p>
                    <p>2. Tap the <strong>Share</strong> icon (square with upward arrow).</p>
                    <p>3. Scroll down and tap <strong>Add to Home Screen</strong>.</p>
                    <p className="text-sky-700 font-semibold pt-1">iOS saves your XP, streak, and 80%+ stage badges automatically on your phone!</p>
                  </div>

                  <div className="space-y-3">
                    <div>
                      <p className="text-xs font-extrabold text-slate-700 mb-1.5">Backup Save Code (Optional Cloud Sync)</p>
                      <button
                        onClick={copySaveCode}

                      >
                        Copy My Progress Save Code
                      </button>
                    </div>

                    <div>
                      <p className="text-xs font-extrabold text-slate-700 mb-1">Restore From Save Code:</p>
                      <div className="flex gap-2">
                        <input

            return (
              <div key={stage.id} className="space-y-4">

                    </span>
                    {!unlocked && <Icon name="Lock" size={16} />}
                  </div>
                  <h2 className="text-lg font-black mt-1">{stage.title}</h2>
                  <p className="text-xs font-semibold text-white/90">{stage.subtitle}</p>
                </div>

                {/* 5 Winding Task Nodes */}
                <div className="flex flex-col items-center py-2 space-y-4">
                  {stage.tasks.map((task, tIdx) => {
                    const bestScore = taskScores[task.id] || 0;
                    const isMastered = bestScore >= 80;
                    const prevTaskPassed = tIdx === 0 || (taskScores[stage.tasks[tIdx - 1].id] || 0) >= 80;
                    const nodePlayable = unlocked && prevTaskPassed;
                    const isBoss = tIdx === 4;

                    return (
                      <div key={task.id} className={`flex flex-col items-center ${offsets[tIdx % offsets.length]}`}>
                        <button
                          disabled={!nodePlayable}
                          onClick={() => onStartTask(stage, task)}

                            isMastered

    // ==================== INTERACTIVE LESSON RUNNER ====================
    function LessonRunner({ lesson, onClose, onComplete }) {
      const [queue, setQueue] = useState(lesson.deck);
      const [index, setIndex] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [builtTiles, setBuiltTiles] = useState([]);
      const [matchedPairIds, setMatchedPairIds] = useState([]);
      const [selectedLeft, setSelectedLeft] = useState(null);
      const [feedback, setFeedback] = useState(null); // { correct: bool, message: string }
      const [stats, setStats] = useState({ totalAnswered: 0, firstTryCorrect: 0, byWord: {} });
      const [finishedAccuracy, setFinishedAccuracy] = useState(null);

      const current = queue[index];

      // Shuffle right-hand column for pairs exercise
      const rightPairs = useMemo(() => {
        if (!current || current.kind !== "pairs") return [];
        return [...current.words].sort(() => Math.random() - 0.5);
      }, [index, current]);

      useEffect(() => {
        if (!current) return;
        setSelectedOption(null);
        setBuiltTiles([]);
        setMatchedPairIds([]);
        setSelectedLeft(null);
        setFeedback(null);
        if (current.word) {
          speakMandarin(current.word.hanzi, 0.82);
        }
      }, [index, current]);

      const recordWordAttempt = (wordId, isCorrect) => {
        setStats(prev => {
          const cur = prev.byWord[wordId] || { correct: 0, wrong: 0 };
          return {
            totalAnswered: prev.totalAnswered + 1,
            firstTryCorrect: prev.firstTryCorrect + (isCorrect ? 1 : 0),
            byWord: {
              ...prev.byWord,
              [wordId]: {
                correct: cur.correct + (isCorrect ? 1 : 0),
                wrong: cur.wrong + (isCorrect ? 0 : 1)
              }
            }
          };
        });
      };

      const advanceStep = () => {
        if (index + 1 < queue.length) {
          setIndex(index + 1);
        } else {
          const acc =
            stats.totalAnswered === 0
              ? 100
              : Math.round((stats.firstTryCorrect / stats.totalAnswered) * 100);
          setFinishedAccuracy(acc);
        }
      };

      const checkChoiceAnswer = () => {
        if (!selectedOption) return;
        const isCorrect = selectedOption.id === current.word.id;
        recordWordAttempt(current.word.id, isCorrect);
        speakMandarin(current.word.hanzi, 0.85);
        if (!isCorrect) {
          // Re-queue missed card at the end for instant repetition mastery
          setQueue(prev => [...prev, { ...current, isRetry: true }]);
        }
        setFeedback({
          correct: isCorrect,
          message: isCorrect
            ? `Spot on! ${current.word.hanzi} (${current.word.pinyin})`
            : `Answer: ${current.word.hanzi} (${current.word.pinyin}) — We'll re-drill this at the end!`
        });
      };

      const checkTileAnswer = () => {
        const userStr = builtTiles.join("");
        const targetStr = current.word.tokens.join("");
        const isCorrect = userStr === targetStr;
        recordWordAttempt(current.word.id, isCorrect);
        speakMandarin(current.word.hanzi, 0.85);
        if (!isCorrect) {
          setQueue(prev => [...prev, { ...current, isRetry: true }]);
        }
        setFeedback({
          correct: isCorrect,
          message: isCorrect
            ? `Clean sentence! ${current.word.pinyin}`
            : `Correct order: ${current.word.tokens.join(" ")} (${current.word.pinyin})`
        });
      };

      const handlePairTap = (side, wordObj) => {
        if (matchedPairIds.includes(wordObj.id)) return;
        if (side === "left") {
          speakMandarin(wordObj.hanzi, 0.85);
          setSelectedLeft(wordObj.id);
        } else if (side === "right" && selectedLeft) {
          if (selectedLeft === wordObj.id) {
            const nextMatched = [...matchedPairIds, wordObj.id];
            setMatchedPairIds(nextMatched);
            setSelectedLeft(null);
            recordWordAttempt(wordObj.id, true);
            if (nextMatched.length === current.words.length) {
              setFeedback({ correct: true, message: "All pairs matched!" });
            }
          } else {
            recordWordAttempt(selectedLeft, false);
            setSelectedLeft(null);
          }
        }
      };

      // Completion Screen
      if (finishedAccuracy !== null) {
        const passed = finishedAccuracy >= 80;
        return (
          <div className="absolute inset-0 bg-white z-40 flex flex-col justify-between p-6 safe-top safe-bottom animate-pop">
            <div />
            <div className="text-center space-y-4">
              <div className="text-6xl">{passed ? "🏆" : "💪"}</div>
              <h2 className="text-2xl font-black text-slate-800">
                {passed ? "Task Mastered!" : "Good Warm-Up!"}
              </h2>
              <p className="text-sm text-slate-600 font-semibold max-w-[280px] mx-auto">
                {passed
                  ? "You scored 80% or higher and unlocked progress toward the next Stage!"
                  : "You need 80% to master this node. Run it again right now—repetition locks it in!"}
              </p>

              <div className="flex justify-center gap-4 pt-2">
                <div className={`px-5 py-3 rounded-2xl border-2 ${passed ? "bg-emerald-50 border-emerald-300 text-emerald-700" : "bg-amber-50 border-amber-300 text-amber-700"}`}>
                  <p className="text-[11px] font-black uppercase">Accuracy</p>
                  <p className="text-2xl font-black">{finishedAccuracy}%</p>
                </div>
                <div className="px-5 py-3 rounded-2xl border-2 bg-sky-50 border-sky-200 text-sky-700">
                  <p className="text-[11px] font-black uppercase">Earned</p>
                  <p className="text-2xl font-black">+{Math.max(15, Math.round(finishedAccuracy * 0.4))} XP</p>
                </div>
              </div>
            </div>

            <button
              onClick={() => onComplete(finishedAccuracy, stats.byWord)}
              className="w-full py-4 rounded-2xl bg-[#58CC02] border-b-4 border-[#46A302] active:translate-y-1 text-white font-black text-base"
            >
              Continue to Path
            </button>
          </div>
        );
      }

      const pct = Math.round(((index + 1) / queue.length) * 100);

      return (
        <div className="absolute inset-0 bg-white z-40 flex flex-col safe-top safe-bottom">
          {/* Top Progress Bar */}
          <div className="px-4 pt-3 pb-2 flex items-center gap-3">
            <button onClick={onClose} className="text-slate-400 hover:text-slate-700 p-1">
              <Icon name="X" size={22} />
            </button>
            <div className="flex-1 h-3.5 bg-slate-100 rounded-full overflow-hidden">
              <div className="h-full bg-[#58CC02] transition-all duration-300 rounded-full" style={{ width: `${pct}%` }} />
            </div>
            <span className="text-xs font-black text-sky-600">∞</span>
          </div>

          <div className="px-5 pt-1">
            <span className="text-[11px] font-black uppercase tracking-wider text-slate-400">
              {current.isRetry ? "🔁 Repeat Drill • Missed Card" : lesson.badge}
            </span>
          </div>

          {/* Exercise Body */}
          <div className="flex-1 px-5 py-3 flex flex-col justify-center overflow-y-auto">
            {current.kind === "intro" && (
              <div className="bg-sky-50 border-2 border-sky-200 rounded-3xl p-6 text-center space-y-4 animate-pop">
                <span className="text-xs font-black uppercase tracking-widest bg-[#1CB0F6] text-white px-3 py-1 rounded-full">
                  New Survival Phrase
                </span>
                <div className="py-2">
                  <p className="text-4xl font-black text-slate-800">{current.word.hanzi}</p>
                  <p className="text-lg font-extrabold text-[#1CB0F6] mt-1">{current.word.pinyin}</p>
                  <p className="text-base font-bold text-slate-700 mt-2">{current.word.english}</p>
                </div>

                <div className="flex justify-center gap-3">
                  <button
                    onClick={() => speakMandarin(current.word.hanzi, 0.9)}
                    className="flex items-center gap-1.5 px-4 py-2.5 rounded-2xl bg-[#1CB0F6] border-b-4 border-[#1899D6] text-white font-black text-xs active:translate-y-0.5"
                  >
                    <Icon name="Volume2" size={16} />
                    <span>Listen 1.0x</span>
                  </button>
                  <button
                    onClick={() => speakMandarin(current.word.hanzi, 0.55)}
                    className="flex items-center gap-1.5 px-4 py-2.5 rounded-2xl bg-amber-400 border-b-4 border-amber-600 text-amber-950 font-black text-xs active:translate-y-0.5"
                  >
                    <span>🐢 Slow 0.55x</span>

                        setBuiltTiles(prev => [...prev, tok]);
                      }}
                      className="px-4 py-2.5 rounded-2xl bg-white border-2 border-b-4 border-slate-300 active:translate-y-0.5 font-black text-slate-800 text-base"
                    >
                      {tok}
                    </button>
                  ))}
                </div>
              </div>
            )}

            {current.kind === "pairs" && (
              <div className="space-y-4 animate-pop">
                <h3 className="text-lg font-black text-slate-800">Tap the matching Mandarin & English pairs:</h3>
                <div className="grid grid-cols-2 gap-2.5">
                  <div className="space-y-2.5">
                    {current.words.map(w => {
                      const matched = matchedPairIds.includes(w.id);
                      const selected = selectedLeft === w.id;
                      return (
                        <button
                          key={w.id}
                          disabled={matched}
                          onClick={() => handlePairTap("left", w)}
                          className={`w-full p-3 rounded-2xl border-2 border-b-4 text-center transition-all ${
                            matched
                              ? "bg-emerald-50 border-emerald-200 text-emerald-400 opacity-50"
                              : selected
                              ? "bg-[#DDF4FF] border-[#1CB0F6] text-sky-900"
                              : "bg-white border-slate-200 text-slate-800"
                          }`}
                        >
                          <p className="font-black text-sm">{w.hanzi}</p>
                          <p className="text-[11px] font-bold text-[#1CB0F6]">{w.pinyin}</p>
                        </button>
                      );
                    })}
                  </div>

                  <div className="space-y-2.5">
                    {rightPairs.map(w => {
                      const matched = matchedPairIds.includes(w.id);
                      return (
                        <button
                          key={w.id}
                          disabled={matched}
                          onClick={() => handlePairTap("right", w)}
                          className={`w-full p-3 rounded-2xl border-2 border-b-4 text-center h-[62px] flex items-center justify-center transition-all ${
                            matched
                              ? "bg-emerald-50 border-emerald-200 text-emerald-400 opacity-50"
                              : "bg-white border-slate-200 text-slate-700 active:bg-slate-100"
                          }`}
                        >
                          <p className="font-extrabold text-xs">{w.english}</p>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* Bottom Check / Feedback Footer */}
          <div className={`p-4 border-t-2 ${
            feedback
              ? feedback.correct
                ? "bg-emerald-100 border-emerald-300"
                : "bg-rose-100 border-rose-300"
              : "bg-white border-slate-200"
          }`}>
            {feedback && (
              <p className={`text-xs font-black mb-2.5 ${feedback.correct ? "text-emerald-800" : "text-rose-800"}`}>
                {feedback.correct ? "✅ " : "❌ "}
                {feedback.message}
              </p>
            )}

            {current.kind === "intro" ? (
              <button
                onClick={advanceStep}
                className="w-full py-3.5 rounded-2xl bg-[#58CC02] border-b-4 border-[#46A302] active:translate-y-0.5 text-white font-black text-sm"
              >
                Got It — Start Drill
              </button>
            ) : feedback ? (
              <button
                onClick={advanceStep}
                className={`w-full py-3.5 rounded-2xl border-b-4 active:translate-y-0.5 text-white font-black text-sm ${
                  feedback.correct ? "bg-[#58CC02] border-[#46A302]" : "bg-rose-500 border-rose-700"
                }`}
              >
                Continue
              </button>
            ) : current.kind === "pairs" ? (
              <button
                disabled
                className="w-full py-3.5 rounded-2xl bg-slate-200 text-slate-400 font-black text-sm"
              >
                Match All Pairs Above
              </button>
            ) : (
              <button
                disabled={
                  (current.kind === "tile_build" && builtTiles.length === 0) ||
                  ((current.kind === "listen_choose" || current.kind === "meaning_choose") && !selectedOption)
                }
                onClick={current.kind === "tile_build" ? checkTileAnswer : checkChoiceAnswer}
                className="w-full py-3.5 rounded-2xl bg-[#58CC02] disabled:bg-slate-200 disabled:border-slate-300 disabled:text-slate-400 border-b-4 border-[#46A302] active:translate-y-0.5 text-white font-black text-sm"
              >
                Check Answer
              </button>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
